# https://goreleaser.com — run by .github/workflows/release.yml on v* tags.
version: 2

project_name: zedsearch

# Build with the Go toolchain installed by the workflow (1.27.x) instead of
# letting go.mod's older `go` directive select/download a toolchain.
env:
  - GOTOOLCHAIN=local

before:
  hooks:
    - go mod tidy

builds:
  - id: zedsearch_binaries
    flags:
      - -trimpath
    # `ne` drops gse's embedded jp/zh dictionaries (~37MB);
    # zed_plugin_gse_dict_embed=big then falls back to the small dict.
    tags:
      - ne
      - web
    ldflags:
      - -s -w
      - -X github.com/vcaesar/zedsearch/pkg/meta.Version={{.Version}}
      - -X github.com/vcaesar/zedsearch/pkg/meta.BuildDate={{.Date}}
      - -X github.com/vcaesar/zedsearch/pkg/meta.CommitHash={{.Commit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    main: ./cmd/zedsearch/main.go

  # Same binary, packed by UPX below and shipped as extra *_upx.tar.gz archives.
  # UPX doesn't support macOS/BSD, and its Windows arm/arm64 support is incomplete.
  - id: zedsearch_upx
    flags:
      - -trimpath
    tags:
      - ne
      - web
    ldflags:
      - -s -w
      - -X github.com/vcaesar/zedsearch/pkg/meta.Version={{.Version}}
      - -X github.com/vcaesar/zedsearch/pkg/meta.BuildDate={{.Date}}
      - -X github.com/vcaesar/zedsearch/pkg/meta.CommitHash={{.Commit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    main: ./cmd/zedsearch/main.go

# Only the zedsearch_upx build is packed; default archives, Docker images and
# the Homebrew cask stay unpacked. Some AV tools may flag packed .exe files.
upx:
  - ids: [zedsearch_upx]
    enabled: true
    compress: best
    lzma: true

archives:
  - id: zedsearch
    ids: [zedsearch_binaries]
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
  - id: zedsearch_upx
    ids: [zedsearch_upx]
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
      _upx

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - id: zedsearch
    ids:
      - zedsearch_binaries
    dockerfile: docker/Dockerfile.release
    images:
      - ghcr.io/vcaesar/zedsearch
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"

# https://goreleaser.com/customization/homebrew_casks/
homebrew_casks:
  - name: zedsearch
    ids: [zedsearch]
    repository:
      owner: zinclabs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Cask is only pushed when the HOMEBREW_TAP_GITHUB_TOKEN secret is configured.
    skip_upload: "{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}"
    binaries: [zedsearch]
    homepage: "https://github.com/vcaesar/zedsearch"
    description: |
      ZedSearch is a search engine that does full text indexing. It is a lightweight
      alternative to elasticsearch that requires significantly less resources. It uses
      bluge as the underlying indexing library.
    license: "Apache-2.0"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/zedsearch"]
          end
