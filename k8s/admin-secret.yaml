# Example first admin credentials for kube-deployment.yaml; only used to create
# the admin user on first start. Change the password before applying, or skip
# this file and create the Secret out of band:
#
#   kubectl -n zedsearch create secret generic zedsearch-admin \
#     --from-literal=ZED_FIRST_ADMIN_USER=admin \
#     --from-literal=ZED_FIRST_ADMIN_PASSWORD='...'
#
# Applying this file overwrites an existing zedsearch-admin Secret.
apiVersion: v1
kind: Secret
metadata:
  name: zedsearch-admin
  namespace: zedsearch
type: Opaque
stringData:
  ZED_FIRST_ADMIN_USER: admin
  ZED_FIRST_ADMIN_PASSWORD: Complexpass#123
