# Three-node ZedSearch cluster (pkg/cluster) with a single-node etcd.
# Needs cert-manager (https://cert-manager.io) for the node to node TLS
# certificates and a CNI that enforces NetworkPolicy. Create the Secrets
# first, see admin-secret.yaml and:
#
#   kubectl -n zedsearch create secret generic zedsearch-cluster \
#     --from-literal=ZED_CLUSTER_SECRET="$(openssl rand -hex 32)"
#
# Run three etcd members with auth and TLS for production.
apiVersion: v1
kind: Namespace
metadata:
  name: zedsearch

---

# Private CA for the node certificates: a self-signed root issues the CA,
# the CA issues zedsearch-tls.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: zedsearch-selfsigned
  namespace: zedsearch
spec:
  selfSigned: {}

---

# CA rotation: running nodes read the CA (SSL_CERT_DIR) once, at start. The
# CA lives 10 years and keeps its key when cert-manager renews it (at about
# year 7), so every node still trusts the leaves it signs; the CA a node
# loaded stays valid until its own expiry, any restart in between (a release)
# picks up the renewed one. A new CA key needs every node restarted at once.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zedsearch-ca
  namespace: zedsearch
spec:
  isCA: true
  commonName: zedsearch-ca
  secretName: zedsearch-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: zedsearch-selfsigned
    kind: Issuer

---

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: zedsearch-ca
  namespace: zedsearch
spec:
  ca:
    secretName: zedsearch-ca

---

# Serving certificate of every node: the advertised pod names and the
# client Service. Its ca.crt is the root the nodes verify each other with.
# Renewal of this certificate (not of the CA) is served on the next TLS
# handshake without a restart, from the release after 1.4.2; 1.4.2 and
# earlier serve it after a restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zedsearch-tls
  namespace: zedsearch
spec:
  secretName: zedsearch-tls
  dnsNames:
    - "*.zedsearch-cluster.zedsearch.svc"
    - zedsearch.zedsearch.svc
    - zedsearch
    - localhost
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: zedsearch-ca
    kind: Issuer

---

apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: zedsearch
spec:
  selector:
    app: etcd
  ports:
  - name: client
    port: 2379
    targetPort: client

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: zedsearch
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.7.3
          command:
            - etcd
            - --data-dir=/etcd-data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd.zedsearch.svc:2379
          ports:
            - containerPort: 2379
              name: client
          volumeMounts:
          - name: etcd-data
            mountPath: /etcd-data
  volumeClaimTemplates:
  - metadata:
      name: etcd-data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

---

# etcd holds membership and ownership and has no auth here: only the
# ZedSearch pods may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: etcd
  namespace: zedsearch
spec:
  podSelector:
    matchLabels:
      app: etcd
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: zedsearch-cluster
      ports:
        - port: client

---

# Headless: every pod gets <pod>.zedsearch-cluster.zedsearch.svc, published
# before it is ready so nodes can reach each other while joining.
apiVersion: v1
kind: Service
metadata:
  name: zedsearch-cluster
  namespace: zedsearch
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: zedsearch-cluster
  ports:
  - name: http
    port: 4080
    targetPort: http

---

# Client entry point, any node routes a request to the index owner.
apiVersion: v1
kind: Service
metadata:
  name: zedsearch
  namespace: zedsearch
spec:
  selector:
    app: zedsearch-cluster
  ports:
  - name: http
    port: 4080
    targetPort: http

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zedsearch-cluster
  namespace: zedsearch
spec:
  serviceName: zedsearch-cluster
  replicas: 3
  podManagementPolicy: Parallel
  # every node must run the same version: a template change (a release)
  # reaches no pod by itself, the pods take it together once deleted at once,
  # see the image below
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: zedsearch-cluster
  template:
    metadata:
      labels:
        app: zedsearch-cluster
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zedsearch
          # a pinned release, so every pod runs the same build. Upgrade: set
          # the new tag, `kubectl apply -f k8s/cluster.yaml`, then restart all
          # pods at once: `kubectl -n zedsearch delete pod -l app=zedsearch-cluster`
          image: riotgo/zedsearch:1.4.2
          envFrom:
            - secretRef:
                name: zedsearch-admin
            - secretRef:
                name: zedsearch-cluster
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ZED_DATA_PATH
              value: /data
            - name: ZED_CLUSTER_ENABLE
              value: "true"
            - name: ZED_CLUSTER_NAME
              value: prod
            - name: ZED_CLUSTER_NODE_ID
              value: $(POD_NAME)
            # https: the cluster secret and forwarded credentials never
            # cross the pod network in cleartext. A cluster that ran the http
            # manifest switches like an upgrade, all pods at once, since an
            # http pod without the CA cannot reach an https one.
            - name: ZED_CLUSTER_ADVERTISE_ADDR
              value: https://$(POD_NAME).zedsearch-cluster.zedsearch.svc:4080
            - name: ZED_ETCD_ENDPOINTS
              value: http://etcd.zedsearch.svc:2379
            - name: ZED_SERVER_TLS_CERTIFICATE_FILE
              value: /etc/zedsearch/tls/tls.crt
            - name: ZED_SERVER_TLS_KEY_FILE
              value: /etc/zedsearch/tls/tls.key
            # trust the private CA next to the system roots
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/zedsearch/ca
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 1024m
              memory: 2048Mi
            requests:
              cpu: 32m
              memory: 50Mi
          ports:
            - containerPort: 4080
              name: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 60
          # /readyz also fails while the membership lease may have expired,
          # so the Service stops sending writes the node would reject. Switch
          # to it once the image serves it: an older one answers 404 and
          # would never be ready.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            periodSeconds: 10
          # liveness stays independent of etcd: an etcd outage must not
          # restart every node
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp
          - name: tls
            mountPath: /etc/zedsearch/tls
            readOnly: true
          - name: ca
            mountPath: /etc/zedsearch/ca
            readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: zedsearch-tls
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: ca
        secret:
          secretName: zedsearch-tls
          items:
          - key: ca.crt
            path: ca.crt
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
