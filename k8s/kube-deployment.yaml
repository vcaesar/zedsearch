apiVersion: v1
kind: Namespace
metadata:
  name: zedsearch

---

# First admin credentials; only used to create the admin user on first start.
# Change the password before applying (or create the Secret out of band).
apiVersion: v1
kind: Secret
metadata:
  name: zedsearch-admin
  namespace: zedsearch
type: Opaque
stringData:
  ZED_FIRST_ADMIN_USER: admin
  ZED_FIRST_ADMIN_PASSWORD: Complexpass#123

---

apiVersion: v1
kind: Service
metadata:
  name: z
  namespace: zedsearch
spec:
  clusterIP: None
  selector:
    app: zedsearch
  ports:
  - name: http
    port: 4080
    targetPort: http

---

# create statefulset
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zedsearch
  namespace: zedsearch
  labels:
    name: zedsearch
spec:
  serviceName: z
  replicas: 1
  selector:
    matchLabels:
      name: zedsearch
      app: zedsearch
  template:
    metadata:
      labels:
        name: zedsearch
        app: zedsearch
    spec:
      # Same uid/gid as the image's zedsearch user; fsGroup makes the volume writable.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # terminationGracePeriodSeconds: 0
      containers:
        - name: zedsearch
          image: riotgo/zedsearch:latest
          envFrom:
            - secretRef:
                name: zedsearch-admin
          env:
            - name: ZED_DATA_PATH
              value: /data
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 1024m
              memory: 2048Mi
            requests:
              cpu: 32m
              memory: 50Mi
          ports:
            - containerPort: 4080
              name: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
          - name: data
            mountPath: /data
          # The root filesystem is read-only; os.TempDir is used for object storage spooling.
          - name: tmp
            mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      # storageClassName: default
      # NOTE: You can increase the storage size
      resources:
        requests:
          storage: 10Gi
