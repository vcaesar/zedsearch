name: Nightly

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Queue publishes instead of running them in parallel, so an older, slower build
# can't push :nightly after a newer one.
concurrency:
  group: nightly-dev-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  dev-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Compute dev version
        id: version
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # GITHUB_TOKEN can only push packages under the repo owner; ghcr requires lowercase.
          echo "IMAGE=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/zedsearch-dev" >> "$GITHUB_ENV"
          tag="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          echo "version=${tag#v}-$(git rev-parse --short HEAD)-dev" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ci
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:nightly
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
