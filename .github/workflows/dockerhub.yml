name: Docker Hub

# Runs after Release: the root Dockerfile downloads the prebuilt binary from the
# published GitHub release, so it must wait for goreleaser to upload the assets.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (e.g. 1.2.3)"
        required: true

permissions:
  contents: read

# One run per version: a re-run or manual dispatch of the same release waits
# instead of racing the push. Different versions don't share a queue, since a
# pending run in a shared group would be cancelled by the next one.
concurrency:
  group: dockerhub-${{ inputs.version || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  dockerhub:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    env:
      # Override with the DOCKERHUB_IMAGE repository variable, e.g. vcaesar/zedsearch.
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/zedsearch', secrets.DOCKERHUB_USERNAME) }}
    steps:
      # latest always points to the highest stable (X.Y.Z) release tag, so a
      # prerelease, a backport (1.2.4 after 1.3.0) or a late manual dispatch
      # never moves it backward. Tags are read right before the push.
      - name: Resolve version and tags
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${INPUT_VERSION:-$RELEASE_TAG}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid version '$version'" >&2
            exit 1
          fi
          tags="${IMAGE}:${version}"
          newest="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' \
            | sed 's|^refs/tags/||' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)"
          if [ "$newest" = "v${version}" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tags} (newest stable tag: ${newest:-none})"
      - uses: actions/checkout@v7
        with:
          # Qualified so a same-named branch can't shadow the release tag.
          ref: refs/tags/v${{ steps.version.outputs.version }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
