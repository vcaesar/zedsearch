name: Docker Hub

# Runs after Release: the root Dockerfile downloads the prebuilt binary from the
# published GitHub release, so it must wait for goreleaser to upload the assets.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (e.g. 1.2.3)"
        required: true

permissions:
  contents: read

jobs:
  dockerhub:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    env:
      # Override with the DOCKERHUB_IMAGE repository variable, e.g. vcaesar/zedsearch.
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/zedsearch', secrets.DOCKERHUB_USERNAME) }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          version="${version#v}"
          tags="${IMAGE}:${version}"
          # Prereleases (1.2.3-rc.1) don't move latest.
          case "$version" in *-*) ;; *) tags="${tags},${IMAGE}:latest" ;; esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: v${{ steps.version.outputs.version }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
